services:
  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_DB: wolvcapital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    working_dir: /var/www/html
    # Mount code; keep vendor from being overwritten by the bind
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      # ensure the container uses your env file
      - ./backend/.env:/var/www/html/.env:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: wolvcapital
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db
    # expose only to the internal network; Nginx is public
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
    depends_on:
      - backend
    # expose only to the internal network; Nginx is public
    expose:
      - "3000"

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
