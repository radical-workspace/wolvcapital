version: "3.8"
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: wolvcapital-frontend:prod
    environment:
      - NODE_ENV=production
    ports:
      - "3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wolvcapital-backend:prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    ports:
      - "8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wolvcapital
    volumes:
      - db_data:/var/lib/postgresql/data

  proxy:
    image: nginx:1.25-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
